[package]
name = "quicast-amt"
version = "0.1.0"
edition = "2024"
license = "BSD-2-Clause"
description = "Lightweight Automatic Multicast Tunneling (AMT) implementation."
readme = "README.md"
repository = "https://github.com/QUICast/amt"
keywords = ["amt", "multicast", "tunnel", "udp", "networking"]
categories = ["network-programming"]

[lib]
name = "amt"
path = "src/lib.rs"

[[bin]]
name = "amt"
path = "src/main.rs"

[features]
default = []
metrics = ["dep:serde_json", "mcrx-core/metrics"]

[dependencies]
ctrlc = { version = "3.5.2", features = ["termination"] }
getrandom = "0.3.4"
hmac = "0.13.0"
mcrx-core = { version = "0.2.5", features = ["raw-packets"] }
mctx-core = { version = "0.2.3", features = ["raw-packets"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", optional = true }
sha2 = "0.11.0"
toml = "1.1.2"
