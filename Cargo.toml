[package]
name = "quicast-amt"
version = "0.2.0"
edition = "2024"
license = "BSD-2-Clause"
description = "Lightweight Automatic Multicast Tunneling (AMT) implementation."
readme = "README.md"
repository = "https://github.com/QUICast/amt"
keywords = ["amt", "multicast", "tunnel", "udp", "networking"]
categories = ["network-programming"]

[lib]
name = "amt"
path = "src/lib.rs"

[[bin]]
name = "amt"
path = "src/main.rs"
required-features = ["runtime"]

[[test]]
name = "system_linux"
path = "tests/system_linux.rs"
required-features = ["runtime"]

[features]
default = ["runtime"]
runtime = [
    "dep:ctrlc",
    "dep:libc",
    "dep:mcrx-core",
    "dep:mctx-core",
    "dep:quinn-udp",
    "dep:serde",
    "dep:socket2",
    "dep:toml",
    "dep:windows-sys",
]
driad = []
metrics = ["runtime", "dep:serde_json", "mcrx-core/metrics"]
pmtu-feedback = ["runtime", "mctx-core/raw-ip"]
shared-upstream = ["runtime", "mcrx-core/raw-shared-capture"]

[dependencies]
ctrlc = { version = "3.5.2", features = ["termination"], optional = true }
getrandom = "0.3.4"
hmac = "0.13.0"
libc = { version = "0.2.186", optional = true }
quinn-udp = { version = "0.6.1", default-features = false, optional = true }
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = { version = "1.0.149", optional = true }
sha2 = "0.11.0"
socket2 = { version = "0.6.3", features = ["all"], optional = true }
toml = { version = "1.1.2", optional = true }

[target.'cfg(not(target_os = "ios"))'.dependencies]
mcrx-core = { version = "0.3.0", features = ["raw-packets"], optional = true }
mctx-core = { version = "0.3.0", features = ["raw-packets"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Networking_WinSock"], optional = true }
